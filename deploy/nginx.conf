# Spreads REST requests and WebSocket connections over two API instances.
# Any instance can serve any socket: Redis pub/sub carries events between them.
upstream convo_api {
  server api-1:4200;
  server api-2:4200;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 4200;

  location / {
    proxy_pass http://convo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Idle sockets are kept alive by 30s server pings; this must be longer.
    proxy_read_timeout 120s;
  }
}
