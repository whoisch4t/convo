# Full stack: PostgreSQL + Redis + two API instances behind nginx + web.
#   docker compose up --build        → http://localhost:3200
#   docker compose up postgres redis → only the databases, for `npm run dev`
#
# Two API instances show the realtime layer working across servers: a message sent to
# api-1 reaches sockets on api-2 through Redis pub/sub.
# The secrets below are for local use only. Set real ones in your environment for anything public.

x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  environment:
    NODE_ENV: production
    PORT: 4200
    DATABASE_URL: postgresql://convo:convo@postgres:5432/convo
    REDIS_URL: redis://redis:6379
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-access-secret-change-me-0000000}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-only-refresh-secret-change-me-000000}
    WEB_ORIGIN: http://localhost:3200
    COOKIE_SECURE: 'false'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: convo
      POSTGRES_PASSWORD: convo
      POSTGRES_DB: convo
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api-1: *api
  api-2: *api

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
    ports:
      - '4200:4200'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://lb:4200
        NEXT_PUBLIC_WS_URL: ws://localhost:4200/ws
    depends_on:
      - lb
    ports:
      - '3200:3200'

volumes:
  pgdata:
